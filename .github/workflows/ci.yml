name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run setup
      - run: npm run test:native
      - run: npm run health
      # Never observe or act on the CI desktop.
